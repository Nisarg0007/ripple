name: Ripple Change Impact & Risk Analysis

"on":
  pull_request:
    branches: [ main, master ]

jobs:
  ripple-check:
    name: Ripple Impact Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ripple CI Check
        run: |
          python -m cli.main check . --base ${{ github.event.pull_request.base.sha }} --fail-on high --output-markdown ripple-report.md

      - name: Upload Ripple Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ripple-impact-report
          path: ripple-report.md
